services:
  - type: web
    name: auth-system-backend
    env: python
    plan: free
    root: .
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true

  - type: static_site
    name: auth-system-frontend
    env: static
    plan: free
    root: frontend
    publishPath: .
    autoDeploy: true
