<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset password — AuthSystem</title>
  <meta name="description" content="Reset your AuthSystem password.">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

<aside class="auth-panel">
  <div class="panel-brand">
    <div class="panel-logo">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <span class="panel-brand-name">AuthSystem</span>
  </div>
  <div class="panel-copy">
    <h2 class="panel-headline">Forgot your<br>password?</h2>
    <p class="panel-sub">No problem. Enter your email and we'll send you a reset link right away.</p>
  </div>
  <p class="panel-footer">AuthSystem &copy; 2026</p>
</aside>

<div class="auth-form-side">
  <div class="auth-form-wrap">

    <div class="form-head">
      <h1>Reset password</h1>
      <p>We'll email you a link to reset your password.</p>
    </div>

    <div id="statusAlert" class="alert" role="alert" aria-live="polite"></div>

    <div class="form-fields">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
        <span class="field-msg" id="emailMsg"></span>
      </div>
    </div>

    <button id="resetBtn" class="btn btn-primary" onclick="doForgot()">
      <span class="spinner"></span>
      <span class="btn-text">Send reset link</span>
    </button>

    <div class="form-foot">
      <span>Remembered it? <a href="login.html">Back to sign in</a></span>
    </div>

  </div>
</div>

<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/forgot.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
