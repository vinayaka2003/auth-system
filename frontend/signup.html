<!DOCTYPE html>
<html>

<head>

    <title>Signup</title>

    <link rel="stylesheet" href="css/style.css">

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="container">

    <h1>Create Account</h1>

    <div class="input-group">
        <input
            type="text"
            id="name"
            autocomplete="name"
            placeholder="Name">
    </div>

    <div class="input-group">
        <input
            type="email"
            id="email"
            autocomplete="email"
            placeholder="Email">
    </div>

    <div class="input-group password-wrapper">

        <input
            type="password"
            id="password"
            autocomplete="new-password"
            placeholder="Password">

        <button
            type="button"
            id="passwordToggle"
            class="toggle-password"
            onclick="togglePassword()"
            aria-label="Toggle password">

            <i
                id="eyeIcon"
                data-lucide="eye">
            </i>

        </button>

    </div>

    <button
        id="signupBtn"
        onclick="signup()">
        Signup
    </button>

    <div
        id="g_id_onload"
        data-client_id="893702706174-p8ur1mrrpc84r29h3jsc56sq66koqqc2.apps.googleusercontent.com"
        data-callback="handleGoogleSignup">
    </div>

    <div
        class="g_id_signin"
        data-type="standard">
    </div>

    <p>
        Already have an account?
        <a href="login.html">
            Login
        </a>
    </p>

</div>

<script src="js/signup.js"></script>

<script>
    lucide.createIcons();
</script>

</body>

</html>
